name: Build Rootfs (Debian)

on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Debian release.  mesa: forky 26.1.x, sid 26.2.x, trixie 25.x plus
          26.1.x from backports (the workflow upgrades mesa for trixie).
        type: choice
        options: [trixie, forky, sid]
        default: forky
      desktop:
        description: Desktop environment
        type: choice
        options: [kde, gnome, plasmamobile, none]
        default: kde
      username:
        description: Initial username
        type: string
        default: username
      password:
        description: Initial password (overridden by repo secret ROOTFS_PASSWORD if set)
        type: string
        default: changeme
      hostname:
        description: System hostname
        type: string
        default: debian
      package_repository:
        description: GitHub repository providing Zhiyu packages (owner/repo)
        type: string
        default: PickaxeHit/linux-zhiyu-pkgs

jobs:
  build:
    name: Build rootfs (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free disk space and install host tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android || true
          sudo apt-get update
          sudo apt-get install -y mmdebstrap debian-archive-keyring xz-utils zstd
          df -h /

      - uses: actions/checkout@v4

      - name: Build and package the rootfs
        env:
          RELEASE: ${{ inputs.release }}
          DESKTOP: ${{ inputs.desktop }}
          USERNAME: ${{ inputs.username }}
          PASSWORD: ${{ secrets.ROOTFS_PASSWORD || inputs.password }}
          HOST_NAME: ${{ inputs.hostname }}
          PACKAGE_REPOSITORY: ${{ inputs.package_repository }}
        run: |
          echo "::add-mask::$PASSWORD"
          bash scripts/build-debian-rootfs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ inputs.release }}-aarch64-${{ inputs.desktop }}-rootfs
          path: |
            debian-*-rootfs.tar.xz
            debian-*-rootfs.tar.xz.sha256
          compression-level: 0
          retention-days: 7
