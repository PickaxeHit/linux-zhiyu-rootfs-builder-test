name: Import pinned Void BSP public key

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-void-key.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-void-key
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the existing public key
        run: |
          set -euo pipefail
          mkdir -p templates/void/keys
          curl --fail --location --retry 3 \
            https://github.com/PickaxeHit/linux-zhiyu-nix/releases/download/repo-xbps/repo-public.pem \
            --output templates/void/repo-public.pem
          (cd templates/void && sha256sum -c repo-public.pem.sha256)
          # XBPS stores the MD5 fingerprint of the SSH RSA wire encoding
          # as the filename, but stores the public key itself in PEM form.
          key=templates/void/repo-public.pem
          ssh-keygen -i -m PKCS8 -f "$key" > "$RUNNER_TEMP/void-key.ssh"
          read -r bits fingerprint _ < <(ssh-keygen -E md5 -lf "$RUNNER_TEMP/void-key.ssh")
          test "$bits" -ge 2048
          fingerprint=${fingerprint#MD5:}
          [[ "$fingerprint" =~ ^([0-9a-f]{2}:){15}[0-9a-f]{2}$ ]]
          python3 - "$key" "$bits" "$fingerprint" <<'PY'
          import plistlib
          import sys
          from pathlib import Path
          key = Path(sys.argv[1])
          target = key.parent / "keys" / (sys.argv[3] + ".plist")
          target.write_bytes(plistlib.dumps({
              "public-key": key.read_bytes(),
              "public-key-size": int(sys.argv[2]),
              "signature-by": "Zhiyu Void BSP test",
          }, fmt=plistlib.FMT_XML))
          print(f"Generated XBPS key: {target.name}")
          PY
      - name: Store public trust material in the rootfs test repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/void/repo-public.pem templates/void/keys/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pin Zhiyu Void BSP public key for rootfs builds'
          git push origin HEAD:master
