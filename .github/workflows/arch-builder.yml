name: Build Rootfs (Arch Linux Port)

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop environment
        type: choice
        options: [kde, gnome, plasmamobile, none]
        default: kde
      username:
        description: Initial username
        type: string
        default: username
      password:
        description: Initial password (overridden by repo secret ROOTFS_PASSWORD if set)
        type: string
        default: changeme
      shell:
        description: Login shell of the initial user
        type: choice
        options: [zsh, bash]
        default: zsh
      hostname:
        description: System hostname
        type: string
        default: arch
      bootstrap_date:
        description: Arch Port bootstrap date (YYYY.MM.DD; empty selects newest)
        type: string
        default: ''
      package_repository:
        description: GitHub repository providing Zhiyu packages (owner/repo)
        type: string
        default: PickaxeHit/linux-zhiyu-pkgs

jobs:
  build:
    name: Build rootfs (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free disk space and install host tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android || true
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd gnupg
          df -h /

      - uses: actions/checkout@v4

      - name: Build and package the rootfs
        env:
          ARCH_PORT_BOOTSTRAP_DATE: ${{ inputs.bootstrap_date }}
          ARCH_PORT_KEY_FINGERPRINT: ${{ vars.ARCH_PORT_KEY_FINGERPRINT }}
          DESKTOP: ${{ inputs.desktop }}
          USERNAME: ${{ inputs.username }}
          PASSWORD: ${{ secrets.ROOTFS_PASSWORD || inputs.password }}
          LOGIN_SHELL: ${{ inputs.shell }}
          HOST_NAME: ${{ inputs.hostname }}
          PACKAGE_REPOSITORY: ${{ inputs.package_repository }}
        run: |
          echo "::add-mask::$PASSWORD"
          bash scripts/build-arch-rootfs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: arch-aarch64-${{ inputs.desktop }}-rootfs
          path: |
            arch-aarch64-*-rootfs.tar.xz
            arch-aarch64-*-rootfs.tar.xz.sha256
          compression-level: 0
          retention-days: 7
