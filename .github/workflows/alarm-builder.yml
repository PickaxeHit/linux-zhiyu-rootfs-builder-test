name: Build Rootfs (Arch Linux ARM)

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop environment
        type: choice
        options: [kde, gnome, plasmamobile, none]
        default: kde
      username:
        description: Initial username
        type: string
        default: user
      password:
        description: Initial password (overridden by repo secret ROOTFS_PASSWORD if set)
        type: string
        default: changeme
      shell:
        description: Login shell of the initial user
        type: choice
        options: [zsh, bash]
        default: zsh
      hostname:
        description: System hostname
        type: string
        default: alarm
      package_repository:
        description: GitHub repository providing Zhiyu packages (owner/repo)
        type: string
        default: PickaxeHit/linux-zhiyu-pkgs
      firmware:
        description: Explicitly install linux-firmware
        type: boolean
        default: false

jobs:
  build:
    name: Build rootfs (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free disk space and install host tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android || true
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd
          df -h /

      - uses: actions/checkout@v4

      - name: Build and package the rootfs
        env:
          DESKTOP: ${{ inputs.desktop }}
          USERNAME: ${{ inputs.username }}
          PASSWORD: ${{ secrets.ROOTFS_PASSWORD || inputs.password }}
          LOGIN_SHELL: ${{ inputs.shell }}
          HOST_NAME: ${{ inputs.hostname }}
          PACKAGE_REPOSITORY: ${{ inputs.package_repository }}
          FIRMWARE: ${{ inputs.firmware }}
        run: |
          echo "::add-mask::$PASSWORD"
          bash scripts/build-alarm-rootfs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: alarm-aarch64-${{ inputs.desktop }}-rootfs
          path: |
            alarm-aarch64-*-rootfs.tar.xz
            alarm-aarch64-*-rootfs.tar.xz.sha256
          compression-level: 0
          retention-days: 7
