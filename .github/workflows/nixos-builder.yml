name: Build Rootfs (NixOS)
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop environment (minimal has no desktop)
        type: choice
        options: [minimal, kde, gnome, plasmamobile]
        default: minimal
      configuration:
        description: NixOS build entry point
        type: choice
        options: [flake, configuration.nix]
        default: flake
      username:
        description: Initial username
        type: string
        default: username
      password:
        description: Initial password (overridden by repo secret ROOTFS_PASSWORD if set)
        type: string
        default: changeme
      hostname:
        description: System hostname
        type: string
        default: nixos

permissions:
  contents: read

jobs:
  build:
    name: Build rootfs (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      DESKTOP: ${{ inputs.desktop || 'minimal' }}
      CONFIGURATION: ${{ inputs.configuration || 'flake' }}
      ZHIYU_REQUIRE_CAMERA_CACHE: '1'
      ROOTFS_USERNAME: ${{ inputs.username }}
      ROOTFS_HOSTNAME: ${{ inputs.hostname }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.ZHIYU_BSP_CACHE_PUBLIC_KEY != '' && 'https://github.com/PickaxeHit/linux-zhiyu-pkgs/releases/download/nix-cache-index/' || '' }}
            extra-trusted-public-keys = ${{ vars.ZHIYU_BSP_CACHE_PUBLIC_KEY }}
      - name: Validate build scripts
        run: |
          for script in scripts/build-*.sh; do bash -n "$script"; done
      - name: Build and verify the rootfs and matching boot images
        env:
          PASSWORD: ${{ secrets.ROOTFS_PASSWORD || inputs.password || 'changeme' }}
        run: scripts/build-nixos.sh "$DESKTOP" "$RUNNER_TEMP/deploy" "$CONFIGURATION"
      - name: Name the verified deployment
        id: names
        run: echo "artifact=nixos-zhiyu-$DESKTOP-$CONFIGURATION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ runner.temp }}/deploy/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
